name: Idea
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the moment where Unwall falls short for you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: markdown
    attributes:
      value: Unwall stays client-only and contains no AI, so ideas that need a server or an LLM can only be optional add-ons.
